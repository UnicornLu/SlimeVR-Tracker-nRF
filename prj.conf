#CONFIG_NCS_SAMPLES_DEFAULTS
CONFIG_ASSERT=y
CONFIG_ASSERT_NO_COND_INFO=y
CONFIG_ASSERT_NO_MSG_INFO=y
CONFIG_RESET_ON_FATAL_ERROR=y

CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="SlimeVR-Tracker-nRF"
#CONFIG_NCS_BOOT_BANNER=n
CONFIG_BOOT_BANNER=n

CONFIG_ESB=y
#need to enable for nRF54L
#CONFIG_NRFX_DPPI10=y

CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y
CONFIG_FPU=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_PINCTRL=y

CONFIG_NVS=y
CONFIG_NVS_LOOKUP_CACHE=y
#CONFIG_NVS_INIT_BAD_MEMORY_REGION=y

CONFIG_POWEROFF=y
CONFIG_REBOOT=y

CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_SETTINGS_NONE=y

CONFIG_MPU_ALLOW_FLASH_WRITE=y

CONFIG_RETAINED_MEM=y

# ============================================================
# RTT Logging Configuration (for debugging early boot crashes)
# ============================================================
# Use IMMEDIATE mode to capture logs before early fatal/reboot
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_PRINTK=y

# Console configuration - RTT_CONSOLE is a choice symbol, enable via console subsystem
CONFIG_CONSOLE=y
CONFIG_CONSOLE_SUBSYS=y
# RTT will be automatically selected as console backend when CONFIG_USE_SEGGER_RTT=y

# Disable UART console (use RTT instead)
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART_AUTOSTART=n

# Log processing thread configuration (not needed in IMMEDIATE mode, but keep for compatibility)
CONFIG_LOG_SPEED=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_LOG_FUNC_NAME_PREFIX_ERR=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_ADC_LOG_LEVEL_OFF=y
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=50
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=1024

CONFIG_PWM=y
CONFIG_GPIO=y

CONFIG_CRC=y

CONFIG_NEWLIB_LIBC=y
CONFIG_NRFX_TIMER1=y

#speed up boot? (use internal rc oscillator)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=n
#speed up boot? (synthesize lf clock)
#CONFIG_CLOCK_CONTROL_NRF_K32SRC_SYNTH=y

# dont need it
CONFIG_CRYPTO=n

# set timeout for 25ms, sufficient for ~1000 bytes
CONFIG_I2C_NRFX_TRANSFER_TIMEOUT=25

CONFIG_USB_DEVICE_HID=y
CONFIG_USB_DEVICE_VID=0x1209
CONFIG_USB_DEVICE_PID=0x7692
CONFIG_USB_HID_BOOT_PROTOCOL=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_CDC_ACM=n
# UART_INTERRUPT_DRIVEN requires SERIAL to be enabled, disable it when SERIAL=n
# CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_USB_WORKQUEUE_STACK_SIZE=512

# Serial/UART configuration (disabled - using RTT for debugging)
CONFIG_SERIAL=n
# UART_LINE_CTRL requires SERIAL to be enabled, disable it when SERIAL=n
# CONFIG_UART_LINE_CTRL=n

# USB configuration
# Increase USB CDC ACM ring buffer size
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096
CONFIG_USB_DRIVER_LOG_LEVEL_ERR=y
CONFIG_USB_DEVICE_LOG_LEVEL_ERR=y
# USB CDC ACM log level (use correct choice syntax)
# CONFIG_USB_CDC_ACM_LOG_LEVEL_OFF is a choice symbol, set the actual log level instead
# CONFIG_USB_CDC_ACM_LOG_LEVEL=0

# Console subsystem already enabled above for RTT support
# CONSOLE_GETLINE is a choice symbol, will be selected automatically if console is enabled

CONFIG_NVS_LOG_LEVEL_WRN=y
CONFIG_USB_HID_LOG_LEVEL_WRN=y

CONFIG_USB_DEVICE_SOF=y
CONFIG_USB_HID_REPORTS=256

#CONFIG_USB_HID_POLL_INTERVAL_MS=1
CONFIG_USB_HID_POLL_INTERVAL_MS=0
CONFIG_HID_INTERRUPT_EP_MPS=64
#CONFIG_ENABLE_HID_INT_OUT_EP=y

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=256
CONFIG_MAIN_STACK_SIZE=512
#crashing on nrf54l at 512

CONFIG_THREAD_NAME=y

# TODO: because of icm426, this will break things and needs to be raised to at least 3k
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_ISR_STACK_SIZE=1024

CONFIG_PM_DEVICE=y

CONFIG_USE_SENSOR_CLOCK=y
CONFIG_SENSOR_USE_MAG=n
CONFIG_USE_ACTIVE_TIMEOUT=y

# 3 minutes timeout with wake on motion
CONFIG_USE_IMU_WAKE_UP=y
CONFIG_USE_IMU_TIMEOUT=n
CONFIG_ACTIVE_TIMEOUT_DELAY=180000
CONFIG_SENSOR_USE_LOW_POWER_2=y

# or 6 hours timeout
# CONFIG_USE_IMU_WAKE_UP=n
# CONFIG_ACTIVE_TIMEOUT_DELAY=21600000
# CONFIG_SENSOR_USE_LOW_POWER_2=n

# 30 second low power timeout
CONFIG_SENSOR_LP_TIMEOUT=30000

CONFIG_USER_EXTRA_ACTIONS=y
CONFIG_DISABLE_SENSOR_GPIOS_ON_SHUTDOWN=y

CONFIG_ESB_TX_FIFO_SIZE=8
CONFIG_ESB_RX_FIFO_SIZE=8
CONFIG_RADIO_RF_CHANNEL=76
CONFIG_RADIO_RETRANSMIT_DELAY=600
CONFIG_CONNECTION_ENABLE_ACK=n
CONFIG_RADIO_TX_POWER=8
# 1 minutes timeout after ping continuous failed
CONFIG_CONNECTION_TIMEOUT_DELAY=60000

CONFIG_SENSOR_USE_6_SIDE_CALIBRATION=y
CONFIG_SENSOR_USE_SENS_CALIBRATION=y
CONFIG_SENSOR_SENS_REV=5

CONFIG_BOOTLOADER_MCUBOOT=y

# MCUboot image manager: Allow app to confirm itself after first boot
# This will auto-confirm the slot0 image after the app runs once
# Note: This doesn't help with the first boot, but will help with future boots
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
#CONFIG_MCUBOOT_IMG_CONFIRM=y

#CONFIG_MCUBOOT_ZEPHYR_APP_OVERLAY=n
#CONFIG_BOOT_SWAP_USING_SCRATCH=n

# --- RTT debug ---
CONFIG_RTT_CONSOLE=y

# 避免卡在 UART/USB console 初始化
CONFIG_USB_UART_CONSOLE=n