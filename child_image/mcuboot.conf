# =========================
# MCUboot as USB DFU device
# =========================

# Bootloader normally doesn't need userspace, but USB device stack requires syscalls
CONFIG_USERSPACE=n
CONFIG_ENABLE_SYSCALLS=y

# Required kernel primitives for Zephyr USB device stack paths you hit
CONFIG_MULTITHREADING=y

CONFIG_SYSTEM_WORKQUEUE=y
CONFIG_WORK_QUEUE=y
CONFIG_THREAD_NAME=y

CONFIG_QUEUE=y
CONFIG_SEMAPHORE=y
CONFIG_MUTEX=y
CONFIG_POLL=y

# USB device stack + Nordic USB device controller
CONFIG_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_NRFX=y

# If you use CDC-ACM as transport/debug
CONFIG_USB_CDC_ACM=y

# Optional debug (can disable later to save space)
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
