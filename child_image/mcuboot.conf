# =========================
# MCUboot as USB DFU device
# =========================

# --- Make sure MCUboot is a Zephyr kernel app (not minimal/no-kernel style) ---
CONFIG_MULTITHREADING=y

# --- Needed by Zephyr USB device stack used by usb_dc_nrfx / usb_transfer ---
CONFIG_SYSTEM_WORKQUEUE=y
CONFIG_WORK_QUEUE=y
CONFIG_THREAD_NAME=y

CONFIG_QUEUE=y
CONFIG_SEMAPHORE=y
CONFIG_MUTEX=y

# Some USB paths use poll/atomic and init priorities
CONFIG_POLL=y

# --- USB device stack + controller ---
CONFIG_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_NRFX=y

# If you are using CDC ACM for DFU transport (common)
CONFIG_USB_CDC_ACM=y

# Console/log are optional but often useful while debugging DFU
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG=y
