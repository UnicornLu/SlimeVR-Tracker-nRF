# ============================================================
# TEST: This should cause a Kconfig error if file is being read
# Remove this line after verifying sysbuild reads this file
# ============================================================
CONFIG_THIS_SHOULD_FAIL=y

# ============================================================
# CRITICAL: Kernel threading and syscall configuration
# These MUST come FIRST to override any MCUboot defaults
# ============================================================
CONFIG_MULTITHREADING=y

# Bootloader runs in supervisor mode (no userspace)
# All threads run in supervisor mode, but USB device stack still needs syscall implementations
# With CONFIG_USERSPACE=n and CONFIG_ENABLE_SYSCALLS=y, syscalls directly call kernel functions
CONFIG_USERSPACE=n
CONFIG_ENABLE_SYSCALLS=y

# ============================================================
# REQUIRED: All kernel primitives needed by USB device stack
# These are essential for USB drivers to work
# ============================================================
CONFIG_SYSTEM_WORKQUEUE=y
CONFIG_WORK_QUEUE=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024

# Core synchronization primitives required by USB stack
CONFIG_QUEUE=y
CONFIG_SEMAPHORE=y
CONFIG_MUTEX=y
CONFIG_POLL=y

# Thread naming support (required for USB workqueue)
CONFIG_THREAD_NAME=y

# Work queue configuration
CONFIG_WORK_QUEUE_SUBMIT_FROM_ISR=n

# ============================================================
# Library configuration
# ============================================================
# Use minimal libc for bootloader (smaller footprint)
CONFIG_MINIMAL_LIBC=y

# Main thread and heap configuration
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_ISR_STACK_SIZE=2048

# ============================================================
# USB Configuration - DISABLED in MCUboot
# ============================================================
# USB DFU is typically not needed in bootloader for SlimeVR/nRF52833.
# Application handles USB-CDC/MSC/UF2, bootloader only does swap/serial/BLE DFU.
# Disabling USB avoids dependency issues with kernel primitives.
CONFIG_USB=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_NRFX_USBD=n
CONFIG_USB_CDC_ACM=n
CONFIG_USB_MASS_STORAGE=n
CONFIG_USB_DEVICE_DRIVER=n
CONFIG_BOOT_SERIAL_CDC_ACM=n

# MCUboot partition size is defined in pm_static_*.yml file
