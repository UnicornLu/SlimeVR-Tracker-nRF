# --- avoid z_impl_* syscall path in bootloader ---
CONFIG_USERSPACE=n
CONFIG_ENABLE_SYSCALLS=n

# --- kernel primitives required by Zephyr USB device stack ---
CONFIG_MULTITHREADING=y
CONFIG_SYSTEM_WORKQUEUE=y
CONFIG_WORK_QUEUE=y
CONFIG_THREAD_NAME=y
CONFIG_QUEUE=y
CONFIG_SEMAPHORE=y
CONFIG_MUTEX=y
CONFIG_POLL=y

# --- USB device stack ---
CONFIG_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_NRFX=y
CONFIG_USB_CDC_ACM=y
