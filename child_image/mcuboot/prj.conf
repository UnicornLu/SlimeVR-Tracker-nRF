# ---- Required: turn on kernel threading ----
CONFIG_MULTITHREADING=y

# Bootloader runs in supervisor mode (no userspace)
# All threads run in supervisor mode, but USB device stack still needs syscall implementations
# With CONFIG_USERSPACE=n and CONFIG_ENABLE_SYSCALLS=y, syscalls directly call kernel functions
CONFIG_USERSPACE=n
CONFIG_ENABLE_SYSCALLS=y

# Use minimal libc for bootloader (smaller footprint)
CONFIG_MINIMAL_LIBC=y

# ---- Kernel primitives used by Zephyr USB device stack ----
CONFIG_SYSTEM_WORKQUEUE=y
CONFIG_WORK_QUEUE=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024

CONFIG_QUEUE=y
CONFIG_SEMAPHORE=y
CONFIG_MUTEX=y
CONFIG_POLL=y

# Optional (fixes k_thread_name_set path)
CONFIG_THREAD_NAME=y

# Main thread and heap configuration
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=1024
CONFIG_ISR_STACK_SIZE=2048

# MCUboot USB DFU support (serial recovery over USB)
CONFIG_BOOT_SERIAL_CDC_ACM=y

# USB device stack (since you want USB DFU)
CONFIG_USB=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_NRFX=y
CONFIG_USB_WORKQUEUE_STACK_SIZE=1024
CONFIG_USB_CDC_ACM=y

# MCUboot partition size is defined in pm_static_*.yml file
# The partition size should be at least 0x10000 (64KB) to accommodate USB stack
