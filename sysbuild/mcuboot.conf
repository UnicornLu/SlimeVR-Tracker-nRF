# ============================================================
# MCUboot Configuration - Disable USB to avoid dependency issues
# ============================================================
# 
# According to GPT's analysis, the USB device stack was being 
# pulled into MCUboot, but the required kernel primitives were 
# not enabled. For SlimeVR/nRF52833, bootloader typically doesn't 
# need USB device stack (USB-CDC/MSC/UF2 is usually done in the 
# application, bootloader only does mcuboot swap/serial/BLE DFU).
#
# This explicitly disables USB in MCUboot to prevent the linking errors.

# ---- Disable USB in MCUboot image ----
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_NRFX_USBD=n
CONFIG_USB_CDC_ACM=n
CONFIG_USB_MASS_STORAGE=n
CONFIG_USB_DEVICE_DRIVER=n
CONFIG_BOOT_SERIAL_CDC_ACM=n

# Disable USB-related features
CONFIG_USB=n

# Optional: reduce extra stuff in bootloader (comment out if you need logging)
# CONFIG_CONSOLE=n
# CONFIG_UART_CONSOLE=n
# CONFIG_LOG=n

