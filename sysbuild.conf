SB_CONFIG_BOOTLOADER_MCUBOOT=y

# Explicitly specify MCUboot prj.conf file path
# According to nRF Connect SDK documentation, this should work
# Path is relative to project root (where CMakeLists.txt is located)
SB_CONFIG_MCUBOOT_CONFIG_FILE="child_image/mcuboot/prj.conf"

# MCUboot DTS overlay should be automatically found in boards/sysbuild/mcuboot.overlay
# If needed, uncomment and adjust path:
# SB_CONFIG_MCUBOOT_DTS_OVERLAY_FILE="boards/sysbuild/mcuboot.overlay"
